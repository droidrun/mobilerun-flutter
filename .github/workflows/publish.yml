name: Publish to pub.dev

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    environment: pub-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tags must point to a commit on main.'
            exit 1
          fi
      - name: Verify tag matches release version
        shell: bash
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Package version must be X.Y.Z without a prerelease suffix.'
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::Release tag must match the pubspec version.'
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      # Mint OIDC credentials only after verification and dependency setup.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7 # Dart bundled with Flutter 3.47.9
      - name: Publish
        run: flutter pub publish --force
