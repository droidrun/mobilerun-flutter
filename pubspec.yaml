name: mobilerun_flutter
description: Flutter package for embedding Mobilerun device streaming and events.
version: 0.1.0
repository: https://github.com/droidrun/mobilerun-flutter
issue_tracker: https://github.com/droidrun/mobilerun-flutter/issues
topics:
  - streaming
  - webrtc
  - android
  - remote-control

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  # Pin the element model used by the public API baseline.
  analyzer: 10.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
